<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Sin link desde el menú del dashboard a propósito — página privada,
       protegida con clave propia (ver js/authControl.js). -->
  <title>Panel de control</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css?v=36">
  <!-- SheetJS: solo para el botón "Exportar Excel" del detalle de Transporte. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { background: var(--bg); min-height: 100vh; }
    .control-login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .control-page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    .control-header { margin-bottom: var(--sp-4); }
    .control-header h1 { font-size: 1.4rem; color: var(--text); margin-bottom: 4px; }
    .control-header p { color: var(--text-secondary); font-size: 0.85rem; }
    /* Filtro de fechas: los .sb-pill/.sb-*-select del dashboard público son de
       tema oscuro (pensados para el sidebar) — ilegibles sobre este fondo
       claro, mismo problema ya visto con el filtro de patente. Se usa
       .pill-btn (ya probado en esta página) y controles propios en claro. */
    .control-fecha-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .control-fecha-input { display: block; width: 100%; max-width: 260px; margin-top: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text); background: var(--card); }
    .control-fecha-input.hidden { display: none; }
    .control-fecha-rango-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; max-width: 260px; }
    .control-fecha-rango-row label { font-size: 0.72rem; color: var(--text-secondary); width: 34px; flex-shrink: 0; }
    .control-fecha-rango-row .control-fecha-input { margin-top: 0; }
    .control-fecha-badge { display: block; margin-top: 10px; font-size: 0.78rem; color: var(--text-secondary); }
    /* Grilla de tarjetas: cerradas quedan compactas y parejas; abrir una no
       debe estirar a sus vecinas de la misma fila (align-items: start). */
    .control-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
    .control-card--ancha { grid-column: 1 / -1; }
    .control-password-wrap { position: relative; }
    .control-password-wrap input { padding-right: 38px; }
    .control-password-toggle { position: absolute; right: 6px; top: 10px; background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 1.05rem; padding: 4px; line-height: 1; }
    .control-password-toggle:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="control-login-wrap" id="control-login-wrap">
    <div class="modal-box">
      <h3>Panel de control</h3>
      <p>Acceso restringido.</p>
      <div class="control-password-wrap">
        <input type="password" id="control-password-input" placeholder="Contraseña">
        <button type="button" id="control-password-toggle" class="control-password-toggle" aria-label="Mostrar contraseña"><i class="ti ti-eye"></i></button>
      </div>
      <div class="modal-actions">
        <button id="control-password-submit" class="btn-upload">Ingresar</button>
      </div>
      <div class="modal-error" id="control-password-error"></div>
    </div>
  </div>

  <div class="control-page hidden" id="control-page">
    <div class="control-header">
      <h1>Panel de control</h1>
      <p>Solo para uso interno — no es parte del dashboard público.</p>
    </div>
    <div id="control-body">
      <p class="kpi-empty">Cargando…</p>
    </div>
  </div>

  <script type="module" src="js/control.js?v=8"></script>
</body>
</html>
